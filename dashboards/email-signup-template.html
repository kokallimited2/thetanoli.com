<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Our Newsletter — [Site Name]</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{max-width:480px;margin:0 auto;padding:2rem;text-align:center}
.icon{font-size:3rem;margin-bottom:1rem}
h1{font-size:1.8rem;font-weight:800;line-height:1.3;margin-bottom:.5rem}
h1 em{color:#f59e0b;font-style:normal}
p{color:#94a3b8;font-size:.95rem;line-height:1.6;margin-bottom:1.5rem}
.form-group{display:flex;flex-direction:column;gap:.75rem;max-width:380px;margin:0 auto}
input{padding:.85rem 1rem;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;font-size:1rem;outline:none;transition:border .2s}
input:focus{border-color:#f59e0b}
input::placeholder{color:#64748b}
button{padding:.85rem;border-radius:10px;border:none;background:#f59e0b;color:#0f172a;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .15s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.benefits{list-style:none;margin-top:2rem;text-align:left}
.benefits li{color:#94a3b8;font-size:.85rem;padding:.4rem 0;border-bottom:1px solid rgba(51,65,85,.3)}
.benefits li:last-child{border-bottom:none}
.benefits li::before{content:"✓ ";color:#22c55e;font-weight:700}
.footer{color:#64748b;font-size:.75rem;margin-top:2rem}
.msg{display:none;padding:.75rem;border-radius:8px;margin-bottom:1rem;font-size:.85rem}
.msg.success{display:block;background:#064e3b;border:1px solid #059669;color:#6ee7b7}
.msg.error{display:block;background:#450a0a;border:1px solid #dc2626;color:#fca5a5}
</style>
</head>
<body>
<div class="wrap">
<div class="icon">📬</div>
<h1>Get <em>[Value Proposition]</em> Delivered Weekly</h1>
<p>[Short promise — what subscribers get every week. One sentence, benefit-driven.]</p>

<form id="subForm" action="YOUR_MAILERLITE_FORM_ACTION" method="POST">
<div class="form-group">
<input type="email" name="email" placeholder="your@email.com" required>
<input type="text" name="name" placeholder="First name (optional)" style="margin-top:-.25rem">
<button type="submit">Join Free →</button>
</div>
</form>

<ul class="benefits">
<li>One actionable tip every week</li>
<li>Exclusive resources and tools</li>
<li>No spam — unsubscribe anytime</li>
</ul>

<div class="footer">No spam. Unsubscribe in one click.</div>
</div>

<script>
document.getElementById('subForm').addEventListener('submit', function(e) {
e.preventDefault();
// MailerLite / ConvertKit handle the redirect — or use AJAX
this.submit();
});
</script>
<!-- Replace YOUR_MAILERLITE_FORM_ACTION with your actual form endpoint -->
</body>
</html>
