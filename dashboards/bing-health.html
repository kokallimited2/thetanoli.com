<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bing Health — Portfolio Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px}
h1{font-size:1.5rem;margin-bottom:20px;color:#f8fafc}
h1 span{color:#60a5fa}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#1e293b;border-radius:12px;padding:16px;text-align:center}
.stat-card .num{font-size:2rem;font-weight:700}
.stat-card .label{font-size:.75rem;color:#94a3b8;margin-top:4px}
.healthy .num{color:#22c55e}
.pending .num{color:#f59e0b}
.warning .num{color:#ef4444}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
th{background:#334155;padding:10px 14px;text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8}
td{padding:10px 14px;border-top:1px solid #334155;font-size:.875rem}
.status{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:600}
.verified{background:#166534;color:#86efac}
.pending{background:#92400e;color:#fde68a}
.error{background:#7f1d1d;color:#fca5a5}
.notes{margin-top:20px;padding:12px 16px;background:#1e293b;border-radius:12px;font-size:.8rem;color:#94a3b8;line-height:1.5}
.last-updated{margin-top:12px;font-size:.7rem;color:#64748b;text-align:right}
</style>
</head>
<body>
<h1>🔍 <span>Bing</span> Search Console Health</h1>

<div class="stats">
  <div class="stat-card healthy">
    <div class="num" id="healthy-count">7</div>
    <div class="label">Verified</div>
  </div>
  <div class="stat-card pending">
    <div class="num" id="pending-count">7</div>
    <div class="label">Pending</div>
  </div>
  <div class="stat-card warning">
    <div class="num" id="total-count">14</div>
    <div class="label">Total Domains</div>
  </div>
</div>

<table>
  <thead>
    <tr><th>Domain</th><th>Bing Status</th></tr>
  </thead>
  <tbody id="domain-table"></tbody>
</table>

<div class="notes" id="notes"></div>
<div class="last-updated" id="last-updated"></div>

<script>
fetch('/dashboards/bing-health.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('healthy-count').textContent = data.healthy;
    document.getElementById('pending-count').textContent = data.total - data.healthy;
    document.getElementById('total-count').textContent = data.total;
    document.getElementById('last-updated').textContent = 'Last checked: ' + new Date(data.last_check).toLocaleString();
    document.getElementById('notes').textContent = data.notes;
    
    const tbody = document.getElementById('domain-table');
    Object.entries(data.domains).sort().forEach(([domain, status]) => {
      const tr = document.createElement('tr');
      const label = status === 'verified' ? '✅ Verified' : status === 'pending_verification' ? '⏳ Pending' : '❌ ' + status;
      const cls = status === 'verified' ? 'verified' : 'pending';
      tr.innerHTML = `<td>${domain}</td><td><span class="status ${cls}">${label}</span></td>`;
      tbody.appendChild(tr);
    });
  });
</script>
</body>
</html>
