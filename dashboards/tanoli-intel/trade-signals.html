<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Tanoli Saab — Trade Signals</title>
<style>
:root { --bg: #0a0f1e; --bg2: #111827; --card: #1e293b; --border: #334155; --accent: #f59e0b; --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --text: #f1f5f9; --text2: #94a3b8; --rad: 12px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; padding: 20px; max-width: 1200px; margin: 0 auto; }
.hero { background: linear-gradient(135deg, #0a0f1e 0%, #1e3a5f 40%, #0d9488 100%); padding: 36px 24px 28px; text-align: center; border-radius: 12px; margin-bottom: 20px; }
.hero h1 { font-size: 1.8rem; font-weight: 800; }
.hero h1 .accent { color: var(--accent); }
.hero .badge { display: inline-block; background: rgba(255,255,255,0.08); padding: 3px 12px; border-radius: 100px; font-size: 11px; color: var(--text2); margin-top: 8px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--rad); padding: 16px; text-align: center; }
.stat-card .value { font-size: 1.6rem; font-weight: 700; }
.stat-card .label { color: var(--text2); font-size: 0.8rem; margin-top: 4px; }
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--rad); margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { background: var(--bg2); padding: 0.6rem 0.8rem; text-align: left; color: var(--text2); font-weight: 600; border-bottom: 1px solid var(--border); }
td { padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--bg2); }
tr:hover td { background: rgba(255,255,255,0.02); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--rad); padding: 16px; margin-bottom: 12px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.tag-green { background: rgba(34,197,94,0.15); color: var(--green); }
.tag-red { background: rgba(239,68,68,0.15); color: var(--red); }
.tag-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
.tag-amber { background: rgba(245,158,11,0.15); color: var(--accent); }
.footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--text2); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<div class="hero">
  <h1>📊 <span class="accent">Tanoli Saab</span> — Trade Signals</h1>
  <div class="badge">Placeholder — send your first dashboard via Telegram</div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="value" style="color: var(--blue)">--</div>
    <div class="label">Total Trades</div>
  </div>
  <div class="stat-card">
    <div class="value" style="color: var(--green)">--</div>
    <div class="label">Wins</div>
  </div>
  <div class="stat-card">
    <div class="value" style="color: var(--red)">--</div>
    <div class="label">Losses</div>
  </div>
  <div class="stat-card">
    <div class="value" style="color: var(--accent)">--</div>
    <div class="label">Win Rate</div>
  </div>
</div>

<div class="card" style="text-align: center; border-color: var(--accent);">
  <div class="card-title" style="margin-bottom: 8px;">📤 Upload Your First Dashboard</div>
  <p style="color: var(--text2); font-size: 0.85rem;">
    Send your HTML file to Wadda Khan via Telegram. It'll appear here within the next batch upload.
  </p>
</div>

<div class="footer">
  Generated by Tanoli Saab · thetanoli.com
</div>
</body>
</html>
