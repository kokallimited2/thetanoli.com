<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Options Performance | Tanoli Intel</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
h1, h2, h3, h4 { color: #58a6ff; margin: 0 0 12px 0; }
h2 { font-size: 1.2em; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-top: 20px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
.metric { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; text-align: center; }
.metric .value { font-size: 1.5em; font-weight: bold; }
.metric .label { font-size: 0.8em; color: #8b949e; margin-top: 4px; }
.green { color: #3fb950; }
.red { color: #f85149; }
.orange { color: #d29922; }
.stat-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.stat-label { min-width: 70px; font-weight: 500; }
.stat-bar { flex: 1; height: 12px; background: #0d1117; border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
.stat-value { min-width: 200px; text-align: right; font-size: 0.85em; color: #8b949e; }
.rec { background: #0d1117; border-left: 3px solid #58a6ff; padding: 8px 12px; margin: 6px 0; font-size: 0.9em; }
a { color: #58a6ff; }
.header { display: flex; justify-content: space-between; align-items: center; }
.header .date { color: #8b949e; font-size: 0.85em; }
table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #30363d; color: #8b949e; font-weight: 600; }
td { padding: 5px 8px; border-bottom: 1px solid #21262d; }
tr:hover { background: #1c2128; }
</style></head><body>

<div class="card">
<div class="header">
<h1>📊 Options Trade Performance</h1>
<span class="date">2026-05-29 01:00</span>
</div>
<div class="metrics">
    <div class="metric"><div class="value green">465</div><div class="label">Total Tracked</div></div>
    <div class="metric"><div class="value">0</div><div class="label">Closed</div></div>
    <div class="metric"><div class="value red">0%</div><div class="label">Win Rate</div></div>
    <div class="metric"><div class="value green">0.0%</div><div class="label">Avg Win</div></div>
    <div class="metric"><div class="value red">0.0%</div><div class="label">Avg Loss</div></div>
    <div class="metric"><div class="value red">0.00</div><div class="label">Expectancy</div></div>
    <div class="metric"><div class="value red">0.0x</div><div class="label">Profit Factor</div></div>
    <div class="metric"><div class="value">0%</div><div class="label">Dir Accuracy</div></div>
    <div class="metric"><div class="value red">+0.0%</div><div class="label">Net P&L</div></div>
    <div class="metric"><div class="value">465</div><div class="label">Still Open</div></div>
    
</div>
</div>





</body></html>
