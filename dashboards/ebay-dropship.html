<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eBay Dropship Hunter — Scanner Hub</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
.tab-header { background: #16162a; border-bottom: 1px solid #2a2a4a; position: sticky; top: 0; z-index: 100; }
.tab-header h1 { font-size: 1.3em; padding: 15px 20px 8px; color: #22c55e; }
.tab-header .sub { color: #888; font-size: 0.8em; padding: 0 20px 10px; }
.tab-nav { display: flex; gap: 2px; padding: 0 15px; overflow-x: auto; }
.tab-btn { padding: 10px 18px; background: transparent; border: none; color: #888; cursor: pointer; font-size: 0.85em; border-radius: 8px 8px 0 0; transition: all 0.2s; white-space: nowrap; }
.tab-btn:hover { background: #1a1a30; color: #ccc; }
.tab-btn.active { background: #1a1a2e; color: #4ade80; font-weight: 600; border-bottom: 2px solid #22c55e; }
.tab-content { background: #1a1a2e; margin: 0; min-height: calc(100vh - 120px); }
.tab-pane { display: none; height: calc(100vh - 120px); }
.tab-pane.active { display: block; }
.tab-pane iframe { width: 100%; height: 100%; border: none; background: #0f0f1a; }
</style>
</head>
<body>

<div class="tab-header">
  <h1>🏪 eBay Dropship Hunter</h1>
  <div class="sub">Daily Scanner · Weekly Wrap · Avasam High-Ticket</div>
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('daily')">📡 Daily eBay Search</button>
    <button class="tab-btn" onclick="switchTab('weekly')">📊 Weekly Consolidation</button>
    <button class="tab-btn" onclick="switchTab('avasam')">🚀 Avasam High-Ticket</button>
  </div>
</div>

<div class="tab-content">
  <div id="tab-daily" class="tab-pane active">
    <iframe src="ebay-daily.html" loading="lazy"></iframe>
  </div>
  <div id="tab-weekly" class="tab-pane">
    <iframe src="ebay-weekly.html" loading="lazy"></iframe>
  </div>
  <div id="tab-avasam" class="tab-pane">
    <iframe src="ebay-avasam.html" loading="lazy"></iframe>
  </div>
</div>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelector(`[onclick="switchTab('${name}')"]`).classList.add('active');
  // Refresh iframe content on switch
  const iframe = document.querySelector(`#tab-${name} iframe`);
  if (iframe) iframe.src = iframe.src;
}
</script>

</body>
</html>
