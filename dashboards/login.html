<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Secure App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }
    .container {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 48px 40px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; color: #fff; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    .tab-bar {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      background: #0f0f1a;
      border-radius: 12px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s;
      border: none;
      background: transparent;
      color: #666;
    }
    .tab.active {
      background: #6c5ce7;
      color: #fff;
      box-shadow: 0 4px 15px rgba(108,92,231,0.3);
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 16px;
      background: #0f0f1a;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      transition: border 0.2s;
      outline: none;
    }
    input:focus { border-color: #6c5ce7; }
    input::placeholder { color: #444; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { background: #5a4bd1; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; color: #555; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a2a3e; }
    .social-btns { display: flex; gap: 12px; }
    .social-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #2a2a3e;
      background: transparent;
      color: #e0e0e0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .social-btn:hover { background: #1f1f35; border-color: #6c5ce7; }
    .message {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .message.error { display: block; background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3); color: #ff4757; }
    .message.success { display: block; background: rgba(46,213,115,0.1); border: 1px solid rgba(46,213,115,0.3); color: #2ed573; }
    .toggle-link { text-align: center; margin-top: 16px; font-size: 13px; color: #666; }
    .toggle-link a { color: #6c5ce7; cursor: pointer; text-decoration: none; }
    .toggle-link a:hover { text-decoration: underline; }
    .hidden { display: none; }
    .loader { display: none; width: 20px; height: 20px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .loader { display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>
    <p class="subtitle">Sign in or create your account</p>

    <div class="tab-bar" id="tabBar">
      <button class="tab active" data-tab="login" onclick="switchTab('login')">Sign In</button>
      <button class="tab" data-tab="signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="message"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <span class="loader"></span>
      </button>
      <div class="toggle-link">
        <a onclick="switchTab('signup')">Don't have an account? Sign up</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn-primary" id="signupBtn">
        <span class="btn-text">Create Account</span>
        <span class="loader"></span>
      </button>
      <div class="toggle-link">
        <a onclick="switchTab('login')">Already have an account? Sign in</a>
      </div>
    </form>

    <div class="divider">or continue with</div>
    <div class="social-btns">
      <button class="social-btn" onclick="signInWith('google')">Google</button>
      <button class="social-btn" onclick="signInWith('github')">GitHub</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qknuholrnhfeduvjhssf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_V1euUYcZKfbITjF3H34l1g_UCGzL1OL';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
      document.getElementById('message').className = 'message';
    }

    function setLoading(btnId, loading) {
      document.getElementById(btnId).classList.toggle('loading', loading);
    }

    async function handleLogin(e) {
      e.preventDefault();
      setLoading('loginBtn', true);
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      setLoading('loginBtn', false);

      if (error) return showMessage(error.message, 'error');
      showMessage('Logged in! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }

    async function handleSignup(e) {
      e.preventDefault();
      setLoading('signupBtn', true);
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      const { data, error } = await supabase.auth.signUp({ email, password });
      setLoading('signupBtn', false);

      if (error) return showMessage(error.message, 'error');
      showMessage('Check your email for confirmation link!', 'success');
    }

    async function signInWith(provider) {
      const { data, error } = await supabase.auth.signInWithOAuth({ provider });
      if (error) showMessage(error.message, 'error');
    }

    // Auto-redirect if already logged in
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();
  </script>
</body>
</html>
